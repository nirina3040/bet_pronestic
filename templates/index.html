<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Football Analyse - Pronostics</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="container mt-4">
        <div class="card shadow">
            <div class="card-header bg-gradient">
                <i class="fas fa-futbol"></i> ANALYSE PRÉDICTIVE
            </div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label fw-bold">
                            <i class="far fa-clock"></i> Heure
                        </label>
                        <input type="time" class="form-control" id="heure" value="17:15">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">
                            <i class="fas fa-home"></i> Équipe Domicile
                        </label>
                        <select class="form-select" id="equipe1" onchange="updateEquipe2Options()">
                            <option value="">Choisir une équipe</option>
                            {% for equipe in equipes %}
                            <option value="{{ equipe }}">{{ equipe }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">
                            <i class="fas fa-flag-checkered"></i> Équipe Extérieur
                        </label>
                        <select class="form-select" id="equipe2" onchange="updateEquipe1Options()">
                            <option value="">Choisir une équipe</option>
                            {% for equipe in equipes %}
                            <option value="{{ equipe }}">{{ equipe }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-1 d-flex align-items-end">
                        <button class="btn btn-success w-100" onclick="ajouterMatch()">
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card mt-4 shadow">
            <div class="card-header bg-gradient">
                <i class="fas fa-list"></i> MATCHS SÉLECTIONNÉS
                <span class="badge bg-light text-dark ms-2" id="matchCount">0</span>
            </div>
            <div class="card-body p-0">
                <table class="table table-bordered mb-0" id="tableMatchs">
                    <thead>
                        <tr>
                            <th>Heure</th>
                            <th>Equipe 1</th>
                            <th></th>
                            <th>Equipe 2</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="matchsBody">
                        <tr>
                            <td colspan="5" class="text-center text-muted">Aucun match sélectionné</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="card-footer">
                <button class="btn btn-outline-danger" onclick="viderMatchs()">
                    <i class="fas fa-trash-alt"></i> Vider
                </button>
                <button class="btn btn-primary float-end" onclick="analyser()">
                    <i class="fas fa-chart-line"></i> ANALYSER
                </button>
            </div>
        </div>

        <div class="card mt-4 shadow" id="resultCard" style="display: none;">
            <div class="card-header bg-gradient-success">
                <i class="fas fa-chart-simple"></i> PRONOSTICS
            </div>
            <div class="card-body" id="resultat"></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
